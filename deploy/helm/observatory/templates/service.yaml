apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: observatory
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: observatory
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8082
      protocol: TCP
