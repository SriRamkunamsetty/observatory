apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: observatory
    release: {{ .Release.Name }}
data:
  RATE_LIMIT_PER_MIN: {{ .Values.config.rateLimitPerMin | quote }}
  TRACE_RETENTION_DAYS: {{ .Values.config.traceRetentionDays | quote }}
  TRUST_PROXY: {{ .Values.config.trustProxy | quote }}
  COOKIE_SECURE: {{ .Values.config.cookieSecure | quote }}
