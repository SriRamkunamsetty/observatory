# Production Helm values for Chat Observatory
replicaCount: 2

image:
  repository: ghcr.io/sriramkunamsetty/observatory
  tag: "0.2.0"
  pullPolicy: IfNotPresent

# Pre-create: kubectl create secret generic observatory-secrets --from-literal=API_KEY=... --from-literal=SECRET_KEY=...
existingSecret: observatory-secrets

config:
  rateLimitPerMin: 240
  traceRetentionDays: 30
  trustProxy: "1"
  cookieSecure: "1"

persistence:
  enabled: true
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""

service:
  type: ClusterIP
  port: 8082

ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: observatory.internal.corp
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: observatory-tls
      hosts:
        - observatory.internal.corp

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s

prometheusRule:
  enabled: true
  alerts:
    highFailureRate:
      enabled: true
      threshold: 0.15
    criticalDrift:
      enabled: true
      threshold: 0.35
