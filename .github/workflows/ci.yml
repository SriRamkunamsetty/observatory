name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest --cov=observatory --cov-report=term-missing --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t observatory:ci .
      - run: |
          docker run -d --name app -p 8082:8082 -e API_KEY=ci-key -e SECRET_KEY=ci-secret observatory:ci
          for i in $(seq 1 20); do curl -fs localhost:8082/healthz && break || sleep 1; done
          curl -fsS localhost:8082/healthz
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: observatory:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/observatory
